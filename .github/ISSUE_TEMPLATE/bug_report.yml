name: Bug report
description: Report an issue with counting, input, saving, or the native app.
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Windows x64 ZIP
        - Linux x64 TAR.GZ
        - Linux AppImage
        - Debian / Ubuntu DEB
        - Built from source
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and desktop
      description: Include the OS version. On Linux, include your desktop and X11 or Wayland if known.
      placeholder: "Windows 11, or Ubuntu 24.04 / GNOME / Wayland"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the steps and the count or window state needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: What should happen, and what happens instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots or additional context
      description: Optional. Remove personal information from screenshots, file paths, and logs.
